services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chainview
      POSTGRES_PASSWORD: chainview
      POSTGRES_DB: chainview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainview -d chainview"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://chainview:chainview@postgres:5432/chainview
      SEC_USER_AGENT: "ChainView Network research@chainview.network"
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:4173"]'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "4173:4173"

volumes:
  postgres_data:
